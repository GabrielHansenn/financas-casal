<h2>Confirme seu email</h2>
<p>Bem-vindo(a) ao Finanças Casal! Toque no botão abaixo para confirmar seu cadastro:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
     style="display:inline-block;padding:12px 20px;background:#171717;color:#ffffff;border-radius:8px;text-decoration:none">
    Confirmar email
  </a>
</p>
<p style="color:#737373;font-size:12px">Se você não criou uma conta, ignore este email.</p>
